[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentsec-agentkeys"
description = "Never-in-context credential broker for AI agents: references in context, secrets only at egress."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dynamic = ["version"]
authors = [{ name = "agentic-suite" }]
keywords = ["agents", "credentials", "secrets", "broker", "mcp", "security"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
]
dependencies = []  # stdlib only (PRD 13 §5)

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.5",
  "mypy>=1.10",
]

[project.scripts]
agentkeys = "agentkeys.cli:main"

[project.entry-points."agentkeys.store"]
sqlite = "agentkeys.store.sqlite:SqliteStore"
memory = "agentkeys.store.memory:MemoryStore"

[project.urls]
Homepage = "https://github.com/agentic-suite/agentsec-agentkeys"

[tool.setuptools.dynamic]
version = { attr = "agentkeys.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["agentkeys"]

[tool.coverage.report]
fail_under = 95
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF", "S"]
# N818: the store contract names its errors `CapabilityError`, `DriverNotFound`, … by design.
ignore = ["N818"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S107", "S603", "SIM105", "RUF043", "E501"]
# Invariant probes are assertions by design; the client-token value is a test fixture, never a secret.
"src/agentkeys/invariants.py" = ["S101", "S106"]
# Conformance checks are assertions; the client token is a fixture, never a secret.
"src/agentkeys/conformance.py" = ["S101", "S106"]
# Attack packs assert that an attack fails; a violated assertion is the red pack.
"src/agentkeys/attackpacks.py" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
name: Publish

# Publishing uses **PyPI trusted publishing** (OIDC): there is no API token anywhere — not in a secret, not
# in a command, not in a log. A token pasted into a chat or a shell is a compromised token; this workflow
# exists so that never has to happen.
#
# One-time setup on PyPI: project → Publishing → add a trusted publisher for this repository with
# workflow `publish.yml` and environment `pypi`.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build sdist + wheel, record checksums
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Checksums (the artefact's identity — published with it)
        run: |
          cd dist
          sha256sum * | tee SHA256SUMS

      - name: SBOM
        run: |
          python -m pip install -e ".[dev]"
          python -m agentkeys.release sbom --write
          cp docs/release/v0.1.0/SBOM.cdx.json dist/SBOM.cdx.json

      - name: Verify the wheel installs and runs before anything is published
        run: |
          python -m venv /tmp/verify
          /tmp/verify/bin/pip install dist/*.whl
          /tmp/verify/bin/agentkeys --version

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: publish to PyPI (trusted publishing — no token)
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/agentsec-agentkeys
    permissions:
      id-token: write # the OIDC token that replaces an API token
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # This release is deliberately UNSIGNED: no Sigstore signature, no SLSA provenance.
          # Do not add attestations here without also earning the "signed release" claim.
          attestations: false

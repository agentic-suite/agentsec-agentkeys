name: CI

on:
  push:
    branches: [main, "feat-*", "release/*"]
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    name: lint · types · tests · coverage (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install (editable + dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff, zero violations)
        run: ruff check src tests && ruff format --check src tests

      - name: Types (mypy --strict)
        run: mypy

      - name: Tests + coverage (>= 95%)
        run: pytest --cov=agentkeys --cov-report=term-missing --cov-fail-under=95

  install-smoke:
    name: pip install smoke (fresh, no cache)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install and run the CLI
        run: |
          python -m pip install --upgrade pip
          pip install .
          agentkeys --version
          agentkeys --help
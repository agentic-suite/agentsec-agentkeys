name: Release audit

# 15.1 — the secret-leakage gate. A live credential in the tree OR in any commit of any branch blocks the
# tag. An unavailable scanner denies the audit (fail closed), and a planted-fake control must fire on every
# run: a scanner that never fires cannot certify anything.
on:
  push:
    branches: [main, "release/*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: secret-leakage audit (tree + full history + control)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install agentkeys (editable + dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Install scanners
        run: |
          curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh \
            | sh -s -- -b /usr/local/bin
          GITLEAKS_VERSION=8.28.0
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks

      - name: Scanner versions
        run: |
          trufflehog --version
          gitleaks version

      - name: Run the audit (fail closed; the planted-fake control must fire)
        run: |
          python -m agentkeys.release audit --root . --json | tee audit.json
          python - <<'PY'
          import json, sys
          payload = json.load(open("audit.json", encoding="utf-8"))
          if not payload["ok"]:
              print("RELEASE AUDIT FAILED", file=sys.stderr)
              for scan in payload["scanners"]:
                  if not scan["ok"]:
                      print(f"  {scan['surface']}: {scan['detail']}", file=sys.stderr)
              raise SystemExit(1)
          print(f"audit green on {payload['git_sha']}")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-audit
          path: audit.json
          if-no-files-found: warn

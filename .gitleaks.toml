# gitleaks config for the v0.1.0 release audit (M15, 15.1).
#
# The default ruleset is kept intact (`useDefault = true`). The allowlist is deliberately **narrow**: it
# suppresses five *exact planted values* and one *named fixture file*, and nothing else. A real leak has a
# different value, so it is still caught — even inside an allowlisted file.
# `tests/test_release_audit.py` asserts both properties (every entry is synthetic; no wildcards/shapes).

[extend]
useDefault = true

[allowlist]
description = "agentkeys synthetic test fixtures only — never a usable credential"

# The M14 field test plants a scoped token into a child environment to prove env virtualization delivers it.
# The value is a synthetic 32-hex fixture generated by the harness, not a credential. These five exact
# values are the only ones ever committed; nothing else under `field-test/` may ever be allowlisted.
regexTarget = "line"
regexes = [
  '''AGENTKEYS_SCOPED_TOKEN': 'e6b6b7a90244fdd57fa69cc156a36b21''',
  '''AGENTKEYS_SCOPED_TOKEN': '29a01348309c07e9af163bf8efc2de41''',
  '''AGENTKEYS_SCOPED_TOKEN': 'c4138fdfb3870bf8c3137038c0cf1693''',
  '''AGENTKEYS_SCOPED_TOKEN': 'ed848efa984e612b7feeb2bf69c780cd''',
  '''AGENTKEYS_SCOPED_TOKEN': '3f6e5d6c7631532515a447a0ffc8d63d''',
]

# `agentkeys scan` needs a repository that *contains* a secret to find one. This fixture is the target: its
# body decodes to `FAKE-PRIVATE-KEY-MATERIAL-ONLY-DOM-NOT-USE`, asserted by
# `tests/test_release_audit.py::test_the_scan_fixture_private_key_is_a_stated_fake`.
paths = ['''tests/fixtures/scan_repo/keys/deploy_key.pem''']
